name = "fraggate-download-tracker"
main = "src/index.js"
compatibility_date = "2026-09-06"
workers_dev = true
# Public in sibling AzielEliab product Workers. First deploy must use this account.
account_id = "ac575a9b822bea2bed97d0ab73aed238"

# First deploy (cannot be done from this cloud agent — no vibelock-account token):
# npx wrangler kv namespace create FRAGGATE_DOWNLOADS
# Then set id below and run:
# npx wrangler deploy
[[kv_namespaces]]
binding = "DOWNLOADS"
id = "00000000000000000000000000000000"

[vars]
FRAGGATE_DOOR = "https://aziel-runtime.vibelock.workers.dev"

# Worker→Worker public fetch of FRAGGATE_DOOR can return HTML/404.
# Proxy via env.AZIEL_RUNTIME.fetch(new Request("https://aziel-runtime/v1/fraggate/…")).
# Hostname is a placeholder (not DNS). HTTP fallback only when unbound.
# FRAGGATE_DOOR stays the display / public URL.
[[services]]
binding = "AZIEL_RUNTIME"
service = "aziel-runtime"

[assets]
directory = "./public"
binding = "ASSETS"
# Worker first so `/v1/fraggate/*` is never an assets 404. Static files
# (`/sigil.png`, tarball) fall through to env.ASSETS in src/index.js.
run_worker_first = true

[observability]
enabled = true

  [observability.logs]
  head_sampling_rate = 1
