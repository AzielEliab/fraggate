[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraggate"
version = "0.1.0"
description = "FragGate FG-0.1: a local kernel against tool fragmentation and model hallucination."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Aziel Eliab"}]
requires-python = ">=3.10"
keywords = [
  "kernel",
  "registry",
  "hallucination",
  "fragmentation",
  "envelope",
  "ledger",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
fraggate = "fraggate.cli:main"

[project.urls]
Homepage = "https://aziel-runtime.vibelock.workers.dev/"
Repository = "https://github.com/AzielEliab/fraggate"
Issues = "https://github.com/AzielEliab/fraggate/issues"
Paper = "https://github.com/AzielEliab/fraggate/blob/main/docs/FG-WP-0.1.md"
Spec = "https://github.com/AzielEliab/fraggate/blob/main/docs/FragGate_v0_spec.md"

[tool.setuptools.packages.find]
include = ["fraggate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
